<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Studio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    color:white;
    display:flex;
    flex-direction:column;
}

h1{
    text-align:center;
    padding:10px;
    color:#00ff88;
    font-size:26px;
    text-shadow:0 0 15px rgba(0,255,136,.4);
}

#chat{
    flex:1;
    margin:0;
    padding:20px;
    overflow-y:auto;
    border-radius:24px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 30px rgba(0,255,136,0.15);
    font-size:18px;
    line-height:1.7;
}

#box{
    display:flex;
    gap:8px;
    padding:12px;
    background:rgba(0,0,0,0.25);
    backdrop-filter:blur(10px);
}

input{
    flex:1;
    padding:18px;
    font-size:18px;
    border:none;
    border-radius:18px;
    outline:none;
    background:#1f2937;
    color:white;
}

button{
    padding:18px;
    border:none;
    border-radius:18px;
    background:#00aa55;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
}

img{
    max-width:100%;
    border-radius:15px;
    margin-top:10px;
}

@media (max-width:600px){

    h1{
        font-size:32px;
    }

    #chat{
        font-size:18px;
        margin:8px;
    }

    input{
        font-size:18px;
    }

    button{
        min-width:60px;
        font-size:18px;
    }
}

</style>
</head>

<body>

<h1>🤖 AI Studio</h1>

<div id="chat">
<p><b>🤖 Taaha:</b> Hello! I'm Taaha, your smart AI assistant. Ask me anything or press 🖼️ to create an image.</p>
</div>

<div id="box">
<input id="msg" placeholder="Type something...">
<button onclick="startListening()">🎤</button>
<button onclick="imageMode()">🖼️</button>
<button onclick="send()">🚀</button>
</div>

<script>

function send(){

    let text = document.getElementById("msg").value;
    let chat = document.getElementById("chat");

    if(text.trim() == "") return;

    chat.innerHTML +=
    "<p style='color:#66ccff'><b>🧑 You:</b> " + text + "</p>";

    chat.innerHTML +=
    "<p id='thinking' style='color:#00ff88'><b>🤖 Taaha:</b> Thinking...</p>";

    fetch("/chat",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            message:text
        })
    })

    .then(response=>response.json())

    .then(data=>{

        document.getElementById("thinking").remove();

        if(data.reply.startsWith("https://image.pollinations.ai/")){

            chat.innerHTML +=
            "<p><b>🤖 Taaha:</b><br><img src='" +
            data.reply +
            "'></p>";

        }else{

            chat.innerHTML +=
            "<p><b>🤖 Taaha:</b> " +
            data.reply +
            "</p>";
        }

        let speech =
        new SpeechSynthesisUtterance(data.reply);

        speech.lang = "en-US";

        window.speechSynthesis.speak(speech);

        chat.scrollTop = chat.scrollHeight;

    });

    document.getElementById("msg").value = "";

}

function startListening(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Speech recognition is not supported.");
return;
}

const recognition = new SpeechRecognition();

recognition.lang = "en-US";

recognition.onresult = function(event){

document.getElementById("msg").value =
event.results[0][0].transcript;

};

recognition.start();

}

function imageMode(){

document.getElementById("msg").value = "Draw ";

document.getElementById("msg").focus();

document.getElementById("msg").select();

}

</script>

</body>
</html>
